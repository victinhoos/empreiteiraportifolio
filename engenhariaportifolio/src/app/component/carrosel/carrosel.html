<div class="carousel-section">
  <!-- Título principal[cite: 1] -->
  <h2 class="section-title">Nossos Projetos de Sucesso</h2>

  <!-- Container do Carrossel -->
  <div class="carousel-container">
    <div class="carousel-track">
      <div 
        class="carousel-card" 
        *ngFor="let project of projects; let i = index"
        [class.active]="i === currentIndex"
        [class.prev]="i === currentIndex - 1 || (currentIndex === 0 && i === projects.length - 1)"
        [class.next]="i === currentIndex + 1 || (currentIndex === projects.length - 1 && i === 0)"
        (click)="goToSlide(i)">
        <img [src]="project.image" [alt]="project.title">
      </div>
    </div>
  </div>

  <!-- Controles de paginação e setas[cite: 1] -->
  <div class="carousel-controls">
    <button class="arrow-btn" (click)="prev()">&#8592;</button>
    <div class="dots">
      <span 
        *ngFor="let project of projects; let i = index" 
        [class.active]="i === currentIndex"
        (click)="goToSlide(i)">
      </span>
    </div>
    <button class="arrow-btn" (click)="next()">&#8594;</button>
  </div>

  <!-- Botão de ação inferior[cite: 1] -->
  <div class="action-container">
    <button class="cta-button">
      QUERO CONHECER OS IMÓVEIS <span class="icon">&#9658;</span>
    </button>
  </div>
</div>
